</style><script type="text/javascript" nonce="2ba9206f01cb41a0aa54721fd07" src="//local.adguard.org?ts=1790259235323&amp;type=content-script&amp;dmn=cht365-my.sharepoint.com&amp;url=https%3A%2F%2Fcht365-my.sharepoint.com%2Fpersonal%2Fjax_cht_com_tw%2F_layouts%2F15%2Fdownload.aspx%3FSourceUrl%3D%252Fpersonal%252Fjax%255Fcht%255Fcom%255Ftw%252FDocuments%252F%25E6%2596%2587%25E4%25BB%25B6%252FCopilot%252F%25E5%25B7%25B2%25E5%25BB%25BA%25E7%25AB%258B%252Findex%25201%252Ehtml&amp;app=msedge.exe&amp;css=3&amp;js=1&amp;rel=1&amp;rji=1&amp;sbe=1&amp;stealth=1&amp;st-loc&amp;st-dnt"></script><script type="text/javascript" nonce="2ba9206f01cb41a0aa54721fd07" src="//local.adguard.org?ts=1790259235323&amp;name=AdGuard%20Extra&amp;name=AdGuard%20Popup%20Blocker&amp;type=user-script"></script></head><body><main class="app"><header class="top"><div><div class="tag">NETAPP NS0-005 PRACTICE EXAM</div><h1>互動模擬考卷</h1><div class="sub">共 60 題，題目與選項皆會亂數排序。版本 v3</div></div><div class="tools"><button class="btn" onclick="restart(1)">重新作答</button><button class="btn" onclick="restart(1)">隨機排序</button><button class="btn" onclick="reveal()">顯示本題答案</button></div></header><div class="mobile-note">iPhone 建議：用 Safari 開啟網址後，點「分享」→「加入主畫面」，即可像 App 一樣使用。作答進度會自動保存在本機。</div><div id="jump" class="jump" aria-label="題號快速跳轉"></div><section class="stats"><div class="track"><div id="bar" class="bar"></div></div><div id="done" class="pill"></div><div id="mini" class="pill"></div></section><section id="exam" class="card"><div class="head"><b id="qnum" class="qnum"></b><span id="type"></span></div><div class="body"><div id="stem" class="stem"></div><div id="opts" class="options"></div><div id="fb" class="fb"></div><div id="hint" class="hint"></div><div class="actions"><button id="prev" class="btn" onclick="move(-1)">上一題</button><button id="next" class="btn primary" onclick="move(1)">下一題</button></div></div></section><section id="result" class="card result"><h2>作答結果</h2><div id="score" class="score"></div><p id="pct"></p><button class="btn primary" onclick="restart(1)">再考一次</button><div id="review" class="review"></div></section></main><script>const original=[{"id": 1, "stem": "What is a high-performance NetApp compliance solution option that creates nonmodifiable and nonerasable volumes to prevent files from being altered or deleted until a set retention date?", "options": [["A", "SnapLock"], ["B", "WORM storage"], ["C", "SnapVault"], ["D", "FPolicy"]], "correct": ["A"]}, {"id": 2, "stem": "Which AI architecture enables generative applications like ChatGPT and requires distributed computing and large data sets for training?", "options": [["A", "Decision trees"], ["B", "Perceptrons"], ["C", "Transformers"], ["D", "Genetic algorithms"]], "correct": ["C"]}, {"id": 3, "stem": "An administrator has installed a NetApp ASA r2 cluster.\u000bWhich two components are a part of the storage virtual machine when presenting data to a host? (Choose two.)", "options": [["A", "Storage units"], ["B", "LIFs"], ["C", "Buckets"], ["D", "Aggregates"]], "correct": ["A", "B"]}, {"id": 4, "stem": "What is the process of moving a running VM from one physical host to another physical host without disrupting normal operations?", "options": [["A", "Storage virtualization"], ["B", "Live migration"], ["C", "Network migration"], ["D", "Data virtualization"]], "correct": ["B"]}, {"id": 5, "stem": "Which NetApp tool enables customers to address risk factors and opportunities to improve system availability, security, and performance?", "options": [["A", "NetApp Copy and Sync"], ["B", "Storage Workload Security"], ["C", "NetApp Ransomware Resilience"], ["D", "NetApp Digital Advisor"]], "correct": ["D"]}, {"id": 6, "stem": "A customer is considering NetApp Backup and Recovery. They want the ability to restore entire logical sets of data and to drill down and restore from a more granular level of their file system.\nWhich two restore capabilities does NetApp Backup and Recovery provide to meet these restore demands? (Choose two.)", "options": [["A", "Object"], ["B", "File"], ["C", "Aggregate"], ["D", "Volume"]], "correct": ["B", "D"]}, {"id": 7, "stem": "Which StorageGRID feature enables an administrator to move object data from StorageGRID to Amazon S3 Glacier Deep Archive?", "options": [["A", "FabricPool"], ["B", "NetApp Copy and Sync"], ["C", "Cloud Storage Pool"], ["D", "S3 Object Lock"]], "correct": ["C"]}, {"id": 8, "stem": "Which feature used in NetApp’s ONTAP-based cyber vault reference architecture sets retention and creates immutable and indelible Snapshot copies?", "options": [["A", "SnapVault"], ["B", "SnapMirror active sync"], ["C", "SnapLock Compliance"], ["D", "SnapCenter"]], "correct": ["C"]}, {"id": 9, "stem": "A customer needs an InfiniBand solution with consistent high performance for petabyte-scale applications.\nWhich NetApp solution meets these requirements?", "options": [["A", "A-Series MetroCluster configuration"], ["B", "StorageGRID"], ["C", "8-node FAS cluster"], ["D", "E-Series hybrid flash array"]], "correct": ["D"]}, {"id": 10, "stem": "The NetApp DataOps Toolkit integrates with which application?", "options": [["A", "GitLab"], ["B", "NVIDIA Nsight"], ["C", "JupyterHub"], ["D", "GitHub"]], "correct": ["C"]}, {"id": 11, "stem": "During the handoff process, the administrator noticed some LIFs with IP addresses that were not part of the installation workbook.\nIn this scenario, which LIFs automatically have their IP addresses created during the initial setup and are not part of the installation workbook?", "options": [["A", "Cluster LIFs"], ["B", "Node management LIFs"], ["C", "Cluster management LIFs"], ["D", "Intercluster LIFs"]], "correct": ["A"]}, {"id": 12, "stem": "Which two type 1 hypervisors integrate with NetApp solutions? (Choose two.)", "options": [["A", "Red Hat OpenShift Virtualization"], ["B", "Kubernetes"], ["C", "Docker"], ["D", "VMware vSphere"]], "correct": ["A", "D"]}, {"id": 13, "stem": "A company has a large data set that is used at many branch offices worldwide. An administrator needs a solution to save frequently used data locally and centrally lock files for real-time collaboration.\nWhich two NetApp solutions can be used to meet these requirements? (Choose two.)", "options": [["A", "FlexCache technology"], ["B", "NetApp Copy and Sync"], ["C", "NetApp Volume Caching"], ["D", "SnapLock Enterprise"]], "correct": ["A", "C"]}, {"id": 14, "stem": "A globally distributed customer needs to store their unstructured data. The data needs to be accessible with low latency and to support file versioning from different geographic locations.\nWhich storage technology matches the customer’s needs?", "options": [["A", "Object"], ["B", "NAS"], ["C", "SAN"], ["D", "DAS"]], "correct": ["A"]}, {"id": 15, "stem": "A user at a company drags a folder with critical data to another location by mistake, and users can no longer access it. The storage administrator cannot restore the last Snapshot copy, because critical file changes will be lost.\nWhich NetApp tool can the administrator use to identify the folder move activity?", "options": [["A", "Active IQ Unified Manager"], ["B", "NetApp Digital Advisor"], ["C", "Storage Workload Security"], ["D", "ONTAP System Manager"]], "correct": ["C"]}, {"id": 16, "stem": "A retail customer has multiple VMware workloads on premises and needs to provide a service that automates the failover to the cloud using NetApp cloud storage.\nWhich NetApp service enables the protection of VMware workloads?", "options": [["A", "NetApp Backup and Recovery"], ["B", "NetApp Disaster Recovery"], ["C", "NetApp Licenses and Subscriptions"], ["D", "NetApp Replication"]], "correct": ["B"]}, {"id": 17, "stem": "Which two encryption mechanisms are supported with NetApp cloud data storage solutions? (Choose two.)", "options": [["A", "NetApp Storage Encryption"], ["B", "NetApp Aggregate Encryption"], ["C", "NetApp Volume Encryption"], ["D", "Onboard Key Manager"]], "correct": ["B", "C"]}, {"id": 18, "stem": "A company requires a NetApp intelligent data infrastructure solution to protect data within a hybrid environment.\nWhich NetApp tool provides protection and failover from on premises to the cloud?", "options": [["A", "NetApp Disaster Recovery"], ["B", "NetApp Replication"], ["C", "Active IQ Unified Manager"], ["D", "NetApp Copy and Sync"]], "correct": ["A"]}, {"id": 19, "stem": "A company is using a FlexPod reference architecture. The administrator wants to manage the compute, storage, and virtualization environment in a single UI.\nWhich product is used to meet these requirements?", "options": [["A", "Cisco UCS Manager"], ["B", "VMware vCenter"], ["C", "NetApp Active IQ Unified Manager"], ["D", "Cisco Intersight"]], "correct": ["D"]}, {"id": 20, "stem": "A storage administrator logs into their Data Infrastructure Insights environment and wants to install an infrastructure data collector to begin collecting data.\nWhich item is configured first?", "options": [["A", "Agent"], ["B", "Acquisition unit"], ["C", "ONTAP SVM data collector"], ["D", "Data collector"]], "correct": ["B"]}, {"id": 21, "stem": "Which company has technology that is used in a NetApp AIPod infrastructure?", "options": [["A", "AT&T"], ["B", "Supermicro"], ["C", "NVIDIA"], ["D", "Dell"]], "correct": ["C"]}, {"id": 22, "stem": "A customer is implementing a new NetApp ONTAP AFF cluster. The IT department needs to move the NFS data from the current cluster to the new cluster without downtime while preserving all functionality and configurations on the workloads.\nWhich solution is used to meet these requirements?", "options": [["A", "SVM data mobility"], ["B", "SVM SnapMirror"], ["C", "FlexCache technology"], ["D", "MetroCluster software"]], "correct": ["A"]}, {"id": 23, "stem": "A data administrator needs to store customer financial records that are subject to SEC regulations. All files must be retained in an unalterable state for 6 years and must remain easily accessible.\nWhich NetApp feature meets this requirement?", "options": [["A", "SnapLock Enterprise"], ["B", "NetApp Storage Encryption"], ["C", "SnapLock Compliance"], ["D", "NetApp Volume Encryption"]], "correct": ["C"]}, {"id": 24, "stem": "To avoid business interruptions in case of a disaster, a customer requires a fully managed storage solution that provides redundancy across multiple geographic locations.\nWhich solution meets these requirements?", "options": [["A", "NetApp FlexPod AI"], ["B", "NetApp Cloud Volumes ONTAP"], ["C", "NetApp ONTAP Select"], ["D", "Amazon FSx for NetApp ONTAP"]], "correct": ["D"]}, {"id": 25, "stem": "A storage administrator is configuring a new 4-node NetApp AFF ONTAP cluster. The cluster uses SnapMirror replication and provisions FlexCache origin volumes. The aggregates also use NetApp Cloud Tiering to object storage.\nWhat is the minimum number of intercluster LIFs that are required on this cluster?", "options": [["A", "16"], ["B", "12"], ["C", "8"], ["D", "4"]], "correct": ["D"]}, {"id": 26, "stem": "A customer replaces their storage environment as part of lifecycle management. The new environment aligns with the customer’s hybrid cloud strategy and is based on operational expenditure.\nWhat two solutions are part of the offering? (Choose two.)", "options": [["A", "Subscribe to NetApp Cloud Volumes ONTAP."], ["B", "Buy a new NetApp AFF A-Series system."], ["C", "Subscribe to NetApp Data Infrastructure Insights."], ["D", "Subscribe to NetApp Keystone."]], "correct": ["A", "D"]}, {"id": 27, "stem": "A financial customer has a large amount of data in both public and private cloud instances and needs to efficiently identify data with personally identifiable information.\nWhich NetApp monitoring tool can be used to identify this information?", "options": [["A", "Data Infrastructure Insights"], ["B", "NetApp Data Classification"], ["C", "Active IQ Unified Manager"], ["D", "NetApp Digital Advisor"]], "correct": ["B"]}, {"id": 28, "stem": "A company requires all production NAS data to be replicated to a different physical location in case of a natural disaster. The solution must replicate access configurations and local users and groups.\nWhich NetApp solution meets these requirements?", "options": [["A", "SnapMirror SVM"], ["B", "SnapMirror active sync"], ["C", "Snapshot technology"], ["D", "FlexClone technology"]], "correct": ["A"]}, {"id": 29, "stem": "What is required to enable NetApp multi-admin verification?", "options": [["A", "Two administrator approval groups and two rules"], ["B", "One administrator account, one read-only account, and one rule"], ["C", "One administrator account and one rule"], ["D", "One administrator approval group and one rule"]], "correct": ["D"]}, {"id": 30, "stem": "Which NetApp technology does the NetApp Shift toolkit use when converting VM hard drives from one hypervisor to another?", "options": [["A", "FlexVol"], ["B", "FlexCache"], ["C", "Flash Pool"], ["D", "FlexClone"]], "correct": ["D"]}, {"id": 31, "stem": "What are the two types of groupings that are supported using NetApp SANtricity System Manager?", "options": [["A", "Storage nodes and storage pools"], ["B", "Tiers and FabricPool"], ["C", "Storage pools and volume groups"], ["D", "Aggregates and volumes"]], "correct": ["C"]}, {"id": 32, "stem": "Which tool enables an administrator to deploy an SVM and data LIFs in a NetApp cluster?", "options": [["A", "NetApp SANtricity OS"], ["B", "NetApp Active IQ Unified Manager"], ["C", "NetApp ONTAP System Manager"], ["D", "Cisco Intersight Essentials"]], "correct": ["C"]}, {"id": 33, "stem": "Which protocol is supported in StorageGRID?", "options": [["A", "NFS"], ["B", "HTTPS"], ["C", "FTP"], ["D", "CIFS"]], "correct": ["B"]}, {"id": 34, "stem": "A customer in healthcare is implementing a storage solution that complies with privacy regulations.\nWhich regulation focuses on medical information?", "options": [["A", "PCI DSS"], ["B", "GDPR"], ["C", "SOX"], ["D", "HIPAA"]], "correct": ["D"]}, {"id": 35, "stem": "An administrator is replicating data between an on-premises environment and a cloud environment for disaster recovery.\nWhich two working environments are supported? (Choose two.)", "options": [["A", "Azure NetApp Files to on-premises NetApp ONTAP cluster"], ["B", "NetApp Cloud Volumes ONTAP to NetApp Cloud Volumes ONTAP"], ["C", "On-premises NetApp ONTAP cluster to Amazon FSx for NetApp ONTAP"], ["D", "On-premises NetApp ONTAP cluster to NetApp Cloud Volumes ONTAP"]], "correct": ["C", "D"]}, {"id": 36, "stem": "Which NetApp service identifies enhancements for system health, availability, and security and uses artificial intelligence to provide actionable insights to mitigate risks?", "options": [["A", "NetApp Data Classification"], ["B", "NetApp Licenses and Subscriptions"], ["C", "Active IQ Unified Manager"], ["D", "NetApp Digital Advisor"]], "correct": ["D"]}, {"id": 37, "stem": "An associate is using NetApp Console without an agent installed.\nWhich NetApp service can the associate use?", "options": [["A", "NetApp Data Classification"], ["B", "Cloud Volumes ONTAP"], ["C", "NetApp Copy and Sync"], ["D", "NetApp Backup and Recovery"]], "correct": ["B"]}, {"id": 38, "stem": "A new NetApp E-Series system was installed, and it will be configured to host VMFS datastores for a VMware cluster.\nWhat will be configured in NetApp SANtricity for optimal host storage protocol utilization?", "options": [["A", "Pool"], ["B", "Workload"], ["C", "Aggregate"], ["D", "Volume"]], "correct": ["B"]}, {"id": 39, "stem": "A business has two separate physical locations that are connected through a low-bandwidth WAN link. They want real-time access to corporate resources using the NFS protocol from the remote site, while minimizing WAN bandwidth usage.\nWhich NetApp technology meets this need?", "options": [["A", "NetApp Copy and Sync"], ["B", "SnapMirror SVM"], ["C", "SnapMirror active sync"], ["D", "FlexCache"]], "correct": ["D"]}, {"id": 40, "stem": "What are two advantages of using containers? (Choose two.)", "options": [["A", "Containers include all necessary files."], ["B", "Containers reduce networking complexity."], ["C", "Containers are platform independent."], ["D", "Containers can be deployed using an Open Virtualization Format (OVF)."]], "correct": ["A", "C"]}, {"id": 41, "stem": "What are two benefits of configuring ADP on a NetApp AFF or FAS system? (Choose two.)", "options": [["A", "Increased deduplication efficiencies"], ["B", "Decreased disk failure rate"], ["C", "Reduced RAID parity overhead"], ["D", "Optimized storage capacity"]], "correct": ["C", "D"]}, {"id": 42, "stem": "Which two access policies are supported by StorageGRID? (Choose two.)", "options": [["A", "Bucket"], ["B", "Service"], ["C", "Group"], ["D", "ILM"]], "correct": ["A", "C"]}, {"id": 43, "stem": "What allows storage to connect to hosts using the FCP and iSCSI protocols and focuses on high performance and low latency?", "options": [["A", "DAS"], ["B", "NAS"], ["C", "Object"], ["D", "SAN"]], "correct": ["D"]}, {"id": 44, "stem": "A software development company is planning to migrate its on-premises infrastructure to the cloud and is considering NetApp Cloud Volumes ONTAP for their storage needs. They have a large development team that requires frequent access to shared file systems and multiple copies of the same file system for testing, debugging, or parallel development.\nWhich feature of Cloud Volumes ONTAP meets this requirement?", "options": [["A", "FabricPool"], ["B", "SnapMirror"], ["C", "SnapLock"], ["D", "FlexClone"]], "correct": ["D"]}, {"id": 45, "stem": "How does the REST API facilitate hybrid cloud management in NetApp environments?", "options": [["A", "Enables automatic storage replication"], ["B", "Provides unified dashboards"], ["C", "Enables efficient data transfer"], ["D", "Provides a consistent interface across systems"]], "correct": ["D"]}, {"id": 46, "stem": "What NetApp resource is used to check supported shelves and drives before adding to a NetApp AFF HA-pair?", "options": [["A", "Active IQ Unified Manager"], ["B", "Hardware Universe"], ["C", "TCO calculator"], ["D", "Interoperability Matrix Tool"]], "correct": ["B"]}, {"id": 47, "stem": "Which StorageGRID feature enables a compliant information lifecycle management (ILM) policy to prevent object deletion?", "options": [["A", "S3 Object Lock"], ["B", "Cloud Storage Pool"], ["C", "S3 bucket access policy"], ["D", "SnapLock Compliance"]], "correct": ["A"]}, {"id": 48, "stem": "A large storage consumer wants to improve their storage system efficiency by optimizing existing storage resources. They want to use the available space and allocate storage dynamically when needed, instead of reserving storage in advance.\nWhich NetApp ONTAP storage technology meets this requirement?", "options": [["A", "Deduplication"], ["B", "Compaction"], ["C", "Thin provisioning"], ["D", "Compression"]], "correct": ["C"]}, {"id": 49, "stem": "A customer has data on an on-premises volume that needs to be quickly accessed by their analytics application in the cloud. The connection from the cloud provider to the on-premises system has more latency than the cloud analytics application can manage. The customer cannot completely move the volume to the cloud, due to on-premises access requirements.\nWhich NetApp ONTAP feature enables the customer to use NetApp Cloud Volumes ONTAP for quick read and write access to this volume from the cloud?", "options": [["A", "SnapMirror"], ["B", "FlexGroup"], ["C", "FabricPool"], ["D", "FlexCache"]], "correct": ["D"]}, {"id": 50, "stem": "Which NetApp data management tool enables an administrator to create new NetApp ONTAP workloads and assign performance service levels to those workloads?", "options": [["A", "NetApp Digital Advisor"], ["B", "NetApp Ransomware Resilience"], ["C", "Active IQ Unified Manager"], ["D", "NetApp Copy and Sync"]], "correct": ["C"]}, {"id": 51, "stem": "A storage administrator is asked to provision storage on a NetApp E-Series system.\nWhich disk layout type provides the fastest rebuild time after disk failure?", "options": [["A", "Advanced Disk Partitioning"], ["B", "Volume groups"], ["C", "RAID 5"], ["D", "Dynamic Disk pools"]], "correct": ["D"]}, {"id": 52, "stem": "A customer is looking for a service to automatically discover, map, and classify their data and identify access permissions.\nWhich NetApp cloud service meets these requirements?", "options": [["A", "NetApp Digital advisor"], ["B", "Data Infrastructure Insights"], ["C", "NetApp Data Classification"], ["D", "ONTAP System Manager"]], "correct": ["C"]}, {"id": 53, "stem": "A customer has a large heterogeneous environment that includes several on-premises and cloud solutions that use multiple vendors. The customer has experienced several performance issues in the past.\nWhich NetApp tool actively monitors and optimizes performance issues in this environment?", "options": [["A", "NetApp Data Classification"], ["B", "Active IQ Unified Manager"], ["C", "NetApp Digital Advisor"], ["D", "Data Infrastructure Insights"]], "correct": ["D"]}, {"id": 54, "stem": "An administrator is designing an 8-node NetApp AFF ONTAP cluster that will serve CIFS data consisting of 1PB volumes and millions of small files. The data must be provisioned across all nodes with the best performance possible.\nWhich NetApp solution meets these requirements?", "options": [["A", "FlexGroup"], ["B", "FlexVol"], ["C", "Flash Cache"], ["D", "FlashPool"]], "correct": ["A"]}, {"id": 55, "stem": "A NetApp administrator has configured two physical ports into one logical port.\nWhat does the administrator need to configure to logically separate traffic using the new port?", "options": [["A", "VLAN"], ["B", "ifgrp"], ["C", "vPC"], ["D", "LAG"]], "correct": ["A"]}, {"id": 56, "stem": "When the majority of client access is SMB, what volume security style is selected when users need simultaneous access to both NFS and SMB protocols?", "options": [["A", "Mixed"], ["B", "TLS"], ["C", "NTFS"], ["D", "UNIX"]], "correct": ["C"]}, {"id": 57, "stem": "A medium-sized company wants to expand their artificial intelligence team. They use NetApp Cloud Volumes ONTAP in the public cloud for their experiments. Due to high costs, the company wants to move back to on-premises NetApp AFF storage.\nWhich migration method is the most efficient?", "options": [["A", "NetApp Disaster Recovery"], ["B", "NetApp Data Classification"], ["C", "NetApp Replication"], ["D", "NetApp Copy and Sync"]], "correct": ["C"]}, {"id": 58, "stem": "A data warehouse company has identified performance issues within the on-premises environment. They have expressed a need to burst into the cloud with a managed service while maintaining iSCSI, SMB, and NFS protocols.\nWhich solution meets the requirement?", "options": [["A", "Azure NetApp Files"], ["B", "Amazon FSx for NetApp ONTAP"], ["C", "NetApp Cloud Volumes ONTAP"], ["D", "Google Cloud NetApp Volumes"]], "correct": ["B"]}, {"id": 59, "stem": "A customer is provisioning a cloud-based storage solution for Kubernetes-native applications.\u000bWhich NetApp solution meets this requirement?", "options": [["A", "NetApp Copy and Sync"], ["B", "NetApp Trident"], ["C", "NetApp Digital Advisor"], ["D", "NetApp Disaster Recovery"]], "correct": ["B"]}, {"id": 60, "stem": "Which NetApp technology would a storage administrator use to restrict certain file types from being stored on a NetApp cluster?", "options": [["A", "FPolicy"], ["B", "MAV"], ["C", "ARP/AI"], ["D", "MFA"]], "correct": ["A"]}];let qs=[...original],i=0,ans={},lock={};const $=s=>document.querySelector(s),same=(a,b)=>a.length==b.length&&[...a].sort().every((x,j)=>x==[...b].sort()[j]),pts=()=>qs.filter(q=>lock[q.id]&&same(ans[q.id]||[],q.correct)).length;const STORE='ns0005_shuffle_options_v3';function saveState(){try{localStorage.setItem(STORE,JSON.stringify({i,ans,lock}))}catch(e){}}function loadState(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x){i=Math.max(0,Math.min(59,x.i||0));ans=x.ans||{};lock=x.lock||{}}}catch(e){}}function jumpTo(n){i=n;render();window.scrollTo({top:0,behavior:'smooth'})}function renderJump(){jump.innerHTML=qs.map((q,n)=>`<button class="${n===i?'current ':''}${lock[q.id]?'done':''}" onclick="jumpTo(${n})">${n+1}</button>`).join('');const c=jump.children[i];if(c)c.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}function render(){let q=qs[i],a=ans[q.id]||[],d=lock[q.id];exam.style.display='block';result.classList.remove('show');qnum.textContent=`第 ${i+1} 題 / 共 ${qs.length} 題`;type.textContent=q.correct.length>1?`複選題，選 ${q.correct.length} 項`:'單選題';stem.textContent=q.stem;opts.innerHTML=q.options.map(o=>`<button class="opt ${a.includes(o[0])?'selected':''} ${d?(q.correct.includes(o[0])?'correct':a.includes(o[0])?'wrong':''):''}" onclick="pick('${o[0]}')"><span class="letter">${o[0]}</span><span>${o[1]}</span></button>`).join('');let ok=d&&same(a,q.correct);fb.className='fb'+(d?' show '+(ok?'ok':'bad'):'');fb.textContent=d?(ok?'答對了！':`答錯了。正確答案：${q.correct.join('、')}`):'';hint.textContent=d?'答案已顯示，可前往下一題。':q.correct.length>1?`請選 ${q.correct.length} 項，選滿後判定。`:'選擇後立即判定。';prev.disabled=i==0;next.textContent=i==qs.length-1?'查看成績':'下一題';let n=Object.keys(lock).length;done.textContent=`已作答 ${n}`;mini.textContent=`答對 ${pts()}`;bar.style.width=`${n/qs.length*100}%`;renderJump();saveState()}function pick(k){let q=qs[i];if(lock[q.id])return;let a=ans[q.id]||[];if(q.correct.length==1){a=[k];lock[q.id]=1}else{a=a.includes(k)?a.filter(x=>x!=k):[...a,k];if(a.length==q.correct.length)lock[q.id]=1}ans[q.id]=a;render()}function reveal(){let q=qs[i];ans[q.id]=[];lock[q.id]=1;render()}function move(n){if(n>0&&i==qs.length-1)return finish();i=Math.max(0,Math.min(qs.length-1,i+n));render()}function finish(){let s=pts();exam.style.display='none';result.classList.add('show');score.textContent=`${s} / ${qs.length}`;pct.textContent=`正確率 ${Math.round(s/qs.length*100)}%`;let w=qs.filter(q=>!lock[q.id]||!same(ans[q.id]||[],q.correct));review.innerHTML=w.map(q=>`<div><b>原題號 ${q.id}</b>　你的答案：${(ans[q.id]||[]).join('、')||'未作答'}；正確答案：${q.correct.join('、')}</div>`).join('')||'<div>全部答對！</div>'}function shuffleArray(a){for(let x=a.length-1;x>0;x--){const y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}function restart(sh){ans={};lock={};i=0;try{localStorage.removeItem(STORE)}catch(e){}qs=JSON.parse(JSON.stringify(original));if(sh){shuffleArray(qs);qs.forEach(q=>{const correctTexts=q.correct.map(k=>q.options.find(o=>o[0]===k)[1]);const before=q.options.map(o=>o[1]).join('|');shuffleArray(q.options);if(q.options.map(o=>o[1]).join('|')===before)q.options.push(q.options.shift());q.options=q.options.map((o,n)=>[['A','B','C','D'][n],o[1]]);q.correct=q.options.filter(o=>correctTexts.includes(o[1])).map(o=>o[0])})}render()}restart(1);</script></body></html>
